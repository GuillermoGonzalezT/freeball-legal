<!--
  Un solo enlace para compartir la app: desde un iPhone lleva a la App Store,
  desde un Android a Google Play, y desde una compu muestra los dos botones.

  La redirección va en el <head>, antes de dibujar nada, para que en el
  teléfono no se llegue a ver esta página. Los botones quedan siempre debajo:
  si el navegador de adentro de una app (Instagram, por ejemplo) frena la
  redirección, la persona igual tiene dónde tocar.

  Si cambia alguno de los dos enlaces, es acá y en ningún otro lado.
-->
<script>
  (function () {
    var IOS     = 'https://apps.apple.com/app/id6810349114';
    var ANDROID = 'https://play.google.com/store/apps/details?id=com.freeballapp.freeball';

    var ua = navigator.userAgent || '';
    // El iPad se presenta como una Mac; lo delata la pantalla táctil.
    var esIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var esAndroid = /Android/i.test(ua);

    // ?ver deja abrir la página en el teléfono sin que redirija, para revisarla.
    if (/[?&]ver\b/.test(location.search)) return;

    // replace y no href: que "atrás" vuelva a donde estaba la persona y no a
    // esta página, que la mandaría otra vez a la tienda.
    if (esIOS) location.replace(IOS);
    else if (esAndroid) location.replace(ANDROID);
  })();
</script>
