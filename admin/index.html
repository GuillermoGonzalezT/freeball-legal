permalink: /admin/
---
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- El panel no tiene por qué aparecer en un buscador. Esto no es seguridad
     —la página es pública igual—: la seguridad está en la base. -->
<meta name="robots" content="noindex, nofollow">
<title>Admin · FreeBall</title>
<link rel="icon" href="{{ '/assets/icon-256.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/admin/admin.css' | relative_url }}">
</head>

<body>

  <!-- ── Inicio de sesión ─────────────────────────────────────────────── -->
  <div id="vista-login" class="login" hidden>
    <div class="login-marca">
      <img src="{{ '/assets/icon-256.png' | relative_url }}" alt="">
      <span>FreeBall <em>Admin</em></span>
    </div>

    <form id="form-login" class="login-tarjeta" novalidate>
      <h1>Panel de administración</h1>
      <p class="login-ayuda">Iniciá sesión con tu cuenta de FreeBall.</p>

      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required>

      <div id="login-error" class="aviso" hidden></div>
      <button id="login-boton" type="submit">Ingresar</button>
    </form>
  </div>

  <!-- ── Panel ────────────────────────────────────────────────────────── -->
  <div id="vista-panel" class="panel" hidden>
    <header class="barra">
      <div class="barra-marca">
        <img src="{{ '/assets/icon-256.png' | relative_url }}" alt="">
        <span>FreeBall <em>Admin</em></span>
      </div>
      <div class="barra-usuario">
        <span id="usuario-email"></span>
        <button id="boton-salir" class="boton-secundario" type="button">Cerrar sesión</button>
      </div>
    </header>

    <nav id="menu" class="menu" aria-label="Secciones"></nav>

    <main id="contenido" class="contenido"></main>
  </div>

  <!-- Mientras se resuelve si hay sesión -->
  <div id="vista-cargando" class="cargando">Cargando…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>

  <!-- Secciones, en el orden en que aparecen en el menú. Van antes que
       admin.js, que las lee al arrancar. -->
  <script src="{{ '/admin/secciones/analytics.js' | relative_url }}"></script>
  <script src="{{ '/admin/secciones/reportes.js' | relative_url }}"></script>
  <script src="{{ '/admin/secciones/todo.js' | relative_url }}"></script>

  <script src="{{ '/admin/admin.js' | relative_url }}"></script>
</body>
</html>
